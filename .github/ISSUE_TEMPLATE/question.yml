name: ❓ Question
description: Ask about installing or using the Ultralytics YOLO agent skills
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        This form is for questions about these agent skills. For help training or using YOLO, visit the [Ultralytics Community](https://community.ultralytics.com).

  - type: checkboxes
    attributes:
      label: Search before asking
      options:
        - label: I searched the [README](https://github.com/ultralytics/skills#readme) and [existing issues](https://github.com/ultralytics/skills/issues) first.
          required: true

  - type: dropdown
    attributes:
      label: Agent
      description: Which coding agent are you using?
      options:
        - Claude Code
        - Codex
        - Cursor
        - Gemini CLI
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Question
      description: What would you like to know about installing or using the skills?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Include relevant versions, commands, or error messages.
