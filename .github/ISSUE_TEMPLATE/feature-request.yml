name: 🚀 Feature Request
description: Suggest an improvement to the Ultralytics YOLO agent skills
labels: [enhancement]
type: feature
body:
  - type: checkboxes
    attributes:
      label: Search before requesting
      options:
        - label: I searched the [existing issues](https://github.com/ultralytics/skills/issues) and found no similar request.
          required: true

  - type: dropdown
    attributes:
      label: Skill
      description: Which skill should be improved?
      options:
        - yolo
        - yolo-models
        - yolo-datasets
        - yolo-training
        - yolo-tuning
        - yolo-inference
        - yolo-export
        - Installation or plugin packaging
        - New skill
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Use case
      description: What are you trying to accomplish with your coding agent?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed improvement
      description: Describe the guidance or capability you would like the skills to provide.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Add examples, documentation links, or other relevant details.
