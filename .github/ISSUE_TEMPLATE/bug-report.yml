name: 🐛 Bug Report
description: Report incorrect or broken guidance in an Ultralytics YOLO skill
labels: [bug, triage]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Ultralytics YOLO agent skills. For bugs in the `ultralytics` Python package or `yolo` CLI, please use the [Ultralytics repository](https://github.com/ultralytics/ultralytics/issues).

  - type: checkboxes
    attributes:
      label: Search before reporting
      options:
        - label: I searched the [existing issues](https://github.com/ultralytics/skills/issues) and found no similar report.
          required: true

  - type: dropdown
    attributes:
      label: Skill
      description: Which skill contains the problem?
      options:
        - yolo
        - yolo-models
        - yolo-datasets
        - yolo-training
        - yolo-tuning
        - yolo-inference
        - yolo-export
        - Installation or plugin packaging
        - Other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Agent
      description: Which coding agent are you using?
      options:
        - Claude Code
        - Codex
        - Cursor
        - Gemini CLI
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem
      description: Show what you asked, the incorrect guidance you received, and what should have happened instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Versions
      description: Include your agent version and `ultralytics` version when relevant.
      placeholder: |
        Agent: Codex 1.2.3
        ultralytics: 8.4.117

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other details, logs, or screenshots that help reproduce the problem.
