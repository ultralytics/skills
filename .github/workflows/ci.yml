# Continuous Integration (CI) — validate skill format and plugin manifests

name: CI

permissions:
  contents: read # Read code in PRs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate skills and manifests
        run: |
          python .github/scripts/lint_skills.py
